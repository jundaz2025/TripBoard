# Serve the SPA and API under one origin so cookie authentication also works for WebSocket connections.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # Leave multipart overhead above the API's 10 MB file-content limit.
  client_max_body_size 11m;
  location /api/ {
    proxy_pass http://api:8001;
    # Preserve the protocol upgrade and keep idle shared-trip sockets open between heartbeats.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 75s;
  }
  # Client-side URLs must load the same entry document rather than returning a static-file 404.
  location / { try_files $uri $uri/ /index.html; }
}
