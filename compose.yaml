name: tripboard
# Local shared services. Application processes run separately through scripts/dev.sh.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tripboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripboard_local_dev}
      POSTGRES_DB: tripboard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripboard -d tripboard"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
# Named volumes preserve local trips and Redis state when containers restart.
volumes:
  postgres_data:
  redis_data:
